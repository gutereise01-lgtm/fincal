[package]
name = "fincalc-engine"
version = "1.0.0"
edition = "2021"
description = "재무계산기 계산 엔진 (금리스왑·통화스왑·통화선도·옵션·PRS·내재파생 사채·금리커브·BA II Plus 재무계산기)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
